name: Cut a release

# Turn `## Unreleased` into a dated, tagged version, and start the measurement
# that will publish it.
#
# The board measures the most recent release tag, so a release is the thing that
# moves the published denominator and the dated changelog entry is what explains
# the move. Before this, the four steps - bump, date, tag, write the body - were
# by hand and their only ordering was whatever the person remembered.
#
# The release is created as a **draft**, and publish-release.yml flips it when
# the board carrying its version lands. A full conformance run takes about three
# hours, so nothing here polls and nothing waits: a draft sitting open states the
# situation exactly, which is tagged, notes written, board not yet settled. If
# the run fails, dispatch conformance.yml from main with its `ref` input set to
# the tag; that same path finishes the release. Dispatching on the tag itself
# measures it and publishes nothing - see the measurement step at the end of
# this file. If the measurement went green but no board landed, the run is
# fine and only the handover was missed: dispatch results-table.yml with that
# run's id.
#
# So this workflow runs once per version and never has to tolerate its own
# output, which is what makes its preconditions safe to state absolutely.
#
# It also owns the week's measurement. Every Sunday it cuts a release when
# `## Unreleased` holds notes, so work merged during the week reaches the board
# without anyone remembering to release it, and that release's conformance run
# is the week's run. With no notes it dispatches a plain measurement of the
# latest release instead. Either way there is one real-AWS run a week. If the
# cut refuses, the week is still measured, against the previous release.

on:
  schedule:
    - cron: '0 4 * * 0' # 4am UTC every Sunday, when AWS is quieter
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (MAJOR.MINOR.PATCH, no leading v)"
        required: true

# For GITHUB_TOKEN, which does the reading. The App tokens minted below are
# separate, and each is scoped to the one thing it is for: getting past main's
# ruleset, and starting the measurement.
permissions:
  contents: read
  # The head commit's check runs are their own permission; contents does not
  # cover them.
  checks: read
  # Reading this run's own check suite, not dispatching. GITHUB_TOKEN can start
  # a run - workflow_dispatch is the documented exception to it not starting
  # further runs - but the run it starts is attributed to github-actions[bot],
  # and GitHub emits no workflow_run event when a run attributed that way
  # completes. So the measurement ran green for three hours and
  # results-table.yml never heard about it, leaving v3.2.0's draft open. The
  # dispatch is made with an App token for that reason and no other.
  actions: read

# One cut at a time. Queue rather than cancel: a cancelled run can leave a
# bumped tree committed with no tag behind it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Whether this run cuts, and at what version. A dispatch always cuts the
  # version it was given. The schedule cuts only when there are notes to date,
  # and picks the version itself: a minor when the suite changed since the last
  # tag, a patch otherwise, never a major (see nextVersion in
  # scripts/release.mjs).
  plan:
    name: Cut or measure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # What changed since the tag the tree carries, for the version rule.
          # package.json is that tag's version: the cut refuses a version that
          # is not ahead of it, so the two move together.
          current=$(node -p "require('./package.json').version")
          export CHANGED
          CHANGED=$(git diff --name-only "v${current}" HEAD)
          node scripts/release.mjs plan

  release:
    name: Bump, date, tag, draft
    needs: plan
    if: needs.plan.outputs.mode == 'cut'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      # Set the moment the measurement is dispatched, so the fallback below can
      # tell a cut that never reached it from one that did, and never measures
      # the same week twice.
      dispatched: ${{ steps.measure.outputs.dispatched }}
    steps:
      # The `main: gated PRs` ruleset lists this App as a bypass actor, so
      # pushing the bump commit and the tag relaxes no protection. It is also
      # what can see draft releases, which need push access.
      #
      # contents:write and nothing else, because this is the token `checkout`
      # receives and `npm ci` runs beside. The dispatch needs actions:write and
      # mints its own below rather than widening this one.
      #
      # create-github-app-token can only narrow what the installation was
      # granted, so asking for a permission it does not hold fails the whole
      # step with a 422 before anything else runs. The App has no Checks grant,
      # which is why checks:read stays on GITHUB_TOKEN.
      - name: Mint a token for the results bot
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RESULTS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RESULTS_BOT_PRIVATE_KEY }}
          permission-contents: write

      # The token that starts the measurement, minted up here rather than
      # beside the step at the end of the job that reads it. A mint fails
      # outright when the installation does not hold what it asks for, and by
      # the time the dispatch runs the bump is committed, the tag is pushed and
      # the draft is open - so a late failure would strand a cut that then has
      # to be finished by hand. Failing before any of that costs nothing.
      #
      # Separate from the token above because they are handed to different
      # things: that one goes to actions/checkout and sits beside `npm ci` on a
      # freshly bumped tree, this one is read by the dispatch and nowhere else.
      - name: Mint a dispatch token
        id: dispatch-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RESULTS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RESULTS_BOT_PRIVATE_KEY }}
          permission-actions: write

      - uses: actions/checkout@v7
        with:
          ref: main
          # Every tag, so the already-tagged precondition sees all of them.
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          # Do not leave the token in .git/config. This job runs `npm ci`
          # against a freshly bumped tree, which executes every dependency's
          # lifecycle scripts, and this token is a bypass actor on main's
          # ruleset - a persisted credential would be readable by all of them.
          # The one step that needs to push supplies it explicitly instead.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Read the head commit's checks
        env:
          # GITHUB_TOKEN, which carries checks:read from the block above. The
          # App has no Checks grant and asking for one fails the mint outright.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # This dispatched run creates check runs of its own against main's
          # head, so an unfiltered read would always find one in progress and
          # refuse every release. Its own check suite is excluded; every other
          # check on the commit still has to be complete and green.
          OURS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq '.check_suite_id')
          # Slurped through jq rather than filtered by --jq inline: --paginate
          # emits one JSON document per page, so an inline --jq would write
          # several concatenated documents and the script would fail to parse
          # the second one. Conformance alone contributes sixteen jobs, so a
          # commit on main clears the 30-per-page default easily.
          gh api "repos/${GITHUB_REPOSITORY}/commits/main/check-runs?per_page=100" --paginate \
            | jq -s "{ check_runs: [.[].check_runs[] | select(.check_suite.id != $OURS)] }" \
            > "$RUNNER_TEMP/checks.json"

      - name: Read the open releases
        env:
          # The App token, not GITHUB_TOKEN: a draft release is only visible to
          # a token with push access, and the open-draft precondition is the one
          # that stops two measurements racing the board.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate \
            | jq -s '[.[][] | {tag_name, draft}]' > "$RUNNER_TEMP/releases.json"

      # Refuses loudly on every precondition: not main, no pending notes, a red
      # or unfinished check, an already-tagged or backwards version, a draft
      # still open. See scripts/release.mjs for why each one is a refusal rather
      # than a warning.
      - name: Bump the manifests and date the changelog
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          CHECKS_JSON: ${{ runner.temp }}/checks.json
          RELEASES_JSON: ${{ runner.temp }}/releases.json
          NOTES_OUT: ${{ runner.temp }}/release-notes.md
        run: |
          set -euo pipefail
          TAGS=$(git tag --list) node scripts/release.mjs cut
          echo "--- release notes ---"
          cat "$NOTES_OUT"

      # The tagged tree is what gets measured for the next three hours, and
      # nothing has run against it: the required checks passed on the commit
      # before the bump, and "both manifests moved together" is not the same as
      # "the result installs". Without this a bad lockfile yields a tag, a draft
      # and a conformance run that dies at install, whose first visible symptom
      # is a draft that never flips.
      - name: Install against the bumped tree
        run: npm ci

      - name: Commit the bump
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore(release): $VERSION"

      # Annotated, matching every tag the repo already carries.
      - name: Tag and push
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          BOT_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git tag -a "v$VERSION" -m "v$VERSION"
          # One atomic push, not two. Landing main without the tag strands the
          # cut in a state that cannot be recovered from either direction: the
          # same version is refused because package.json already carries it, and
          # the next version is refused because the changelog's `## Unreleased`
          # section has already been consumed. --atomic makes both refs move or
          # neither.
          #
          # Pushed to an explicitly authenticated remote because the checkout
          # deliberately does not persist this token - see the checkout step.
          git push --atomic \
            "https://x-access-token:${BOT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            main "refs/tags/v$VERSION"

      # A draft, and its body cut from the changelog in the state the tag
      # captured rather than reassembled later from a file that has moved on
      # during the measurement.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          NOTES: ${{ runner.temp }}/release-notes.md
        run: |
          set -euo pipefail
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file "$NOTES" \
            --draft

      # The measurement that will publish it.
      #
      # Dispatched on main with the tag as an input, not on the tag itself.
      # results-table.yml only publishes a conformance run whose head_branch is
      # main, and a run dispatched on a tag ref does not report main - so
      # dispatching at the tag would measure it correctly, publish nothing, and
      # leave the draft open with no failure anywhere to say why. The resolver
      # takes an explicit ref verbatim, so the suite still runs from the tag.
      #
      # Explicit rather than letting the resolver pick the latest tag, so this
      # stays correct if another tag is cut while the run is queued.
      - name: Measure the new tag
        id: measure
        env:
          # The App, not GITHUB_TOKEN. Either one starts the run; only this one
          # produces a run whose completion emits a workflow_run event, which is
          # what results-table.yml listens to. See the permissions block.
          GH_TOKEN: ${{ steps.dispatch-token.outputs.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          # A scheduled cut's run is the week's run, so it carries the weekly
          # reporting: a deterministic red files the scheduled-red issue.
          WEEKLY: ${{ github.event_name == 'schedule' }}
        run: |
          set -euo pipefail
          # The newest conformance run before dispatching, so the check below
          # can tell a new one from the one already there.
          before=$(gh run list --workflow conformance.yml -L 1 --json databaseId --jq '.[0].databaseId // 0')

          gh workflow run conformance.yml --ref main -f "ref=v$VERSION" -f "weekly=$WEEKLY"
          echo "dispatched=true" >>"$GITHUB_OUTPUT"

          # Confirmed, not assumed. Everything up to here has already landed -
          # the tag is pushed and the draft exists - so a dispatch that quietly
          # produced no run would leave a draft that never flips, discovered
          # three hours later by someone wondering why. Better to go red now,
          # with the tag and draft in the state the recovery path expects.
          for _ in $(seq 1 18); do
            sleep 5
            after=$(gh run list --workflow conformance.yml -L 1 --json databaseId --jq '.[0].databaseId // 0')
            if [ "$after" != "$before" ]; then
              echo "::notice title=Release v$VERSION drafted::Conformance run $after is measuring v$VERSION. The draft publishes itself when the board lands, in about three hours."
              exit 0
            fi
          done

          echo "::error title=Measurement not started::v$VERSION is tagged and its draft release exists, but no conformance run appeared within 90s of dispatching. Recover by dispatching Conformance Tests from main with its ref input set to v$VERSION."
          exit 1

  # The week's measurement when the schedule did not cut: there were no notes,
  # or the cut refused before it dispatched one (a red check on main, a draft
  # still open). Blank ref, so conformance.yml measures the latest release tag.
  # A refused cut is also reported on the scheduled-red issue, the same place a
  # red weekly run goes, so it cannot sit unnoticed.
  measure:
    name: Measure the latest release
    needs: [plan, release]
    if: >-
      always() && github.event_name == 'schedule' &&
      (needs.plan.result != 'success' || needs.plan.outputs.mode == 'measure' ||
       (needs.release.result != 'success' && needs.release.outputs.dispatched != 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # the scheduled-red issue, when the cut refused
    steps:
      # The App, for the same reason as the cut's dispatch: only a run it starts
      # emits the workflow_run event results-table.yml publishes from.
      - name: Mint a dispatch token
        id: dispatch-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RESULTS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RESULTS_BOT_PRIVATE_KEY }}
          permission-actions: write

      - name: Dispatch the measurement
        env:
          GH_TOKEN: ${{ steps.dispatch-token.outputs.token }}
        run: |
          set -euo pipefail
          before=$(gh run list -R "$GITHUB_REPOSITORY" --workflow conformance.yml -L 1 --json databaseId --jq '.[0].databaseId // 0')
          gh workflow run conformance.yml -R "$GITHUB_REPOSITORY" --ref main -f "weekly=true"
          for _ in $(seq 1 18); do
            sleep 5
            after=$(gh run list -R "$GITHUB_REPOSITORY" --workflow conformance.yml -L 1 --json databaseId --jq '.[0].databaseId // 0')
            if [ "$after" != "$before" ]; then
              echo "::notice title=Weekly measurement started::Conformance run $after is measuring the latest release."
              exit 0
            fi
          done
          echo "::error title=Measurement not started::No conformance run appeared within 90s. Dispatch Conformance Tests from main with weekly set to true."
          exit 1

      - name: Report the refused cut
        if: needs.plan.outputs.mode != 'measure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body="The weekly release was not cut, so this week measures the previous release instead. The notes under \`## Unreleased\` are still waiting. See the refused run for the reason: $RUN_URL. Once it is fixed, dispatch **Cut a release** by hand or wait for next Sunday."
          gh label create scheduled-red -R "$GITHUB_REPOSITORY" --color B60205 --description "Scheduled conformance run went red" 2>/dev/null || true
          existing=$(gh issue list -R "$GITHUB_REPOSITORY" --label scheduled-red --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" -R "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --label scheduled-red \
              --title "Weekly release was not cut ($(date -u +%Y-%m-%d))" --body "$body"
          fi
